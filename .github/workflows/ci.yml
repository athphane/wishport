name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -race ./...
      - run: go vet ./...
      - run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
      - run: go build -trimpath ./cmd/wishport
      - run: python3 scripts/terminal-smoke.py ./wishport
      - run: python3 scripts/hosted-smoke.py ./wishport
      - name: Check release configuration
        uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.20.0
          args: check
