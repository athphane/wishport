name: Release binaries
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - name: Build Linux archives
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath -ldflags="-s -w -X github.com/athphane/wishport/internal/cli.Version=${GITHUB_REF_NAME}" -o dist/wishport ./cmd/wishport
            tar -C dist -czf "dist/wishport_linux_${arch}.tar.gz" wishport
          done
          rm dist/wishport
          cd dist
          sha256sum *.tar.gz > checksums.txt
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --draft --generate-notes
